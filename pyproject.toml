[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyprotein"
version = "0.1.0"
description = "Fly-brain circuits (Drosophila connectome) applied to protein tasks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
esm = ["torch", "transformers"]
connectome = ["neuprint-python", "pandas"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
